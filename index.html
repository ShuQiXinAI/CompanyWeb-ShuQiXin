function hexToRgb(hex) {
  const m = hex.replace('#', '');
  return { r: parseInt(m.slice(0,2),16), g: parseInt(m.slice(2,4),16), b: parseInt(m.slice(4,6),16) };
}

const ParticleFlow = ({ accent = '#4DD4AC' }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = canvas.width = canvas.offsetWidth * devicePixelRatio;
    let h = canvas.height = canvas.offsetHeight * devicePixelRatio;
    const DPR = devicePixelRatio;
    const N = 180;
    const particles = Array.from({length:N}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: 0, vy: 0, life: Math.random(), size: Math.random()*1.4 + 0.3,
    }));
    let raf, t = 0;
    const draw = () => {
      t += 0.004;
      ctx.fillStyle = 'rgba(14,26,46,0.12)';
      ctx.fillRect(0,0,w,h);
      particles.forEach(p => {
        const angle = Math.sin(p.x*0.003 + t) * Math.cos(p.y*0.003 - t) * Math.PI;
        p.vx += Math.cos(angle) * 0.04;
        p.vy += Math.sin(angle) * 0.04 - 0.02;
        p.vx *= 0.96; p.vy *= 0.96;
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.003;
        if (p.life <= 0 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          p.x = Math.random()*w; p.y = h + 20; p.vx = 0; p.vy = 0; p.life = 1;
        }
        const alpha = Math.sin(p.life * Math.PI) * 0.7;
        const color = (p.y/h) < 0.5 ? accent : '#22D3EE';
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size*DPR, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = alpha * 0.25;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx*6, p.y - p.vy*6);
        ctx.strokeStyle = color;
        ctx.lineWidth = p.size*DPR*0.5;
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    };
    draw();
    const onResize = () => {
      w = canvas.width = canvas.offsetWidth * devicePixelRatio;
      h = canvas.height = canvas.offsetHeight * devicePixelRatio;
    };
    window.addEventListener('resize', onResize);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
  }, [accent]);
  return <canvas ref={ref} style={{position:'absolute',inset:0,width:'100%',height:'100%'}}/>;
};

const Vision = ({ accent }) => {
  const [hundred, setHundred] = React.useState(0);
  const [thousand, setThousand] = React.useState(0);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const d = 1800, s = Date.now();
          const tick = () => {
            const p = Math.min(1, (Date.now()-s)/d);
            const eased = 1 - Math.pow(1-p, 3);
            setHundred(Math.floor(100 * eased));
            setThousand(Math.floor(1000 * eased));
            if (p < 1) requestAnimationFrame(tick);
          };
          tick();
          io.disconnect();
        }
      });
    }, {threshold: 0.3});
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, []);

  return (
    <section id="vision" ref={ref} style={{position:'relative', padding:'140px 48px', borderTop:'1px solid var(--line)', overflow:'hidden'}}>
      <div style={{position:'absolute', inset:0, opacity:0.15, pointerEvents:'none', background:`radial-gradient(ellipse at 20% 30%, ${accent} 0%, transparent 40%), radial-gradient(ellipse at 80% 70%, #22D3EE 0%, transparent 40%)`}}/>

/* ───────────────────────── App Root ───────────────────────── */

const API_BASE = 'https://api.shuqixin.com.cn';

const App = () => {
  const accent = '#4DD4AC';
  const [user, setUser] = React.useState(null);

  React.useEffect(() => {
    const token = localStorage.getItem('token');
    const phone = localStorage.getItem('phone');
    if (!token || !phone) return;
    setUser({ phone });
    fetch(API_BASE + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
      .then(r => r.json())
      .then(res => {
        if (res.code === 200) {
          setUser({ phone: res.data.phone });
        } else {
          localStorage.removeItem('token');
          localStorage.removeItem('phone');
          setUser(null);
        }
      })
      .catch(() => {});
  }, []);

  const handleLogout = () => {
    localStorage.removeItem('token');
    localStorage.removeItem('phone');
    setUser(null);
  };

  return (
    <div style={{position:'relative', zIndex:2}}>
      <Nav accent={accent} user={user} onLogout={handleLogout}/>
      <Hero accent={accent}/>
      <Services accent={accent}/>
      <Product accent={accent}/>
      <Vision accent={accent}/>
      <Culture accent={accent}/>
      <About accent={accent}/>
      <Contact accent={accent}/>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
